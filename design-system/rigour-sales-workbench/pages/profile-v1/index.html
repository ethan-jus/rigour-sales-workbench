function page(title,body,foot='',cls=''){return nav(title)+`<div class="body ${cls}">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}<div class="gesture"></div>`}
function row(label,value,target,ico='',sub='',warn=false){return `<button class="menu" onclick="go('${target}')">${ico?icon(ico,'leading'):''}<span class="copy"><span class="menu-title">${label}</span>${sub?`<span class="sub">${sub}</span>`:''}</span>${value?`<span class="trailing ${warn?'warn':''}">${value}</span>`:''}${icon('arrow','chev')}</button>`}
function data(label,value){return `<div class="data-row"><span>${label}</span><span>${value}</span></div>`}
function banner(title,description,kind='check'){return `<div class="status-card"><div class="status-icon ${kind==='check'?'':'orange'}">${icon(kind)}</div><div><h2>${title}</h2><small>${description}</small></div></div>`}
function empty(title,copy,action,label='重新加载',i='info'){return `<div class="empty">${icon(i)}<h2>${title}</h2><p>${copy}</p>${action?btn(label,action,'secondary'):''}</div>`}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.querySelector('.phone').append(e);setTimeout(()=>e.remove(),2500)}
function tabs(){return `<div class="tabbar">${[['home','工作台'],['user','客户'],['pin','拜访'],['bag','订单'],['user','我的']].map((x,i)=>btn(icon(x[0])+x[1],i===4?"state='home';stack=[];render()":"toast('该入口属于其他业务模块，本轮保持原设计')",i===4?'on':'')).join('')}</div>`}
function home(alert=false){return nav('我的',true)+`<div class="body home-body"><button class="identity" onclick="go('identity')"><span class="avatar">张</span><span class="grow"><h1>张松</h1><small>瑞盖文化传媒</small></span>${icon('arrow','chev')}</button>${alert?`<div class="callout">${icon('sync')}<span>2 次拜访材料待同步</span>${btn('处理',"go('sync-pending')")}</div>`:''}<div class="section-title">个人工作</div>${row('外勤记录','','work','calendar')}${row('声音登记',voiceRegistered?'已登记':'未登记',voiceRegistered?'voice':'voice-new','mic')}<div class="section-title">支持与服务</div>${row('材料同步',alert?'待同步':'已同步',alert?'sync-pending':'sync','sync','',alert)}${row('使用帮助','','help','help')}</div>${tabs()}`}
function map(big=false){return `<div class="map ${big?'big':''}"><svg viewBox="0 0 350 180" preserveAspectRatio="xMidYMid slice"><rect width="350" height="180" fill="#f0f2ed" stroke="none"/><path d="M-10 40 370 100M50 -10 100 210M200 -10 160 210M290 -10 340 210" stroke="#fff" stroke-width="17"/><path d="m50 110 56-20 59 14 57-30 62 28" stroke="#c64c1c" stroke-width="3"/><path d="m165 104 57-30" stroke="#f0f2ed" stroke-width="5"/><path d="m165 104 57-30" stroke="#7b858b" stroke-width="2" stroke-dasharray="5 5"/>${[[50,110],[106,90],[165,104],[222,74],[284,102]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="7" fill="${i===0?'#287956':'#fff'}" stroke="${i===0?'#287956':'#c64c1c'}"/>`).join('')}</svg><span class="map-label">${big?'示意轨迹 · 非实测地图':'查看当日轨迹 ↗'}</span></div>`}
function work(isEmpty=false){return page('外勤记录',`<div class="date-nav">${btn(icon('back'),"toast('原型：查看前一天')",'icon-btn','aria-label="前一天"')}${btn('11月17日 · 今天 '+icon('calendar'),"go('date')",'flex')}${btn(icon('arrow'),'', 'icon-btn','disabled aria-label="后一天"')}</div>${isEmpty?empty('当天暂无外勤记录','签到后，你的外勤记录会显示在这里。',"go('date')",'选择其他日期','calendar'):`<div class="punch"><div><small>签到</small><b>09:02</b></div><div><small>签退</small><b style="font-size:20px;line-height:42px">外勤中</b></div></div><div class="facts"><span><small>已结束时段</small>　3小时18分</span><span><small>里程</small>　8.6 km <small>估算</small></span></div><button style="width:100%;padding:0" onclick="go('route')" aria-label="查看当日轨迹">${map()}</button><div class="callout">${icon('info')}<span>1 项外勤记录待核查</span>${btn('查看',"go('case')")}</div><div class="section-title">当日记录</div><div class="timeline">${event('09:02','签到','开始今日外勤','')}${event('09:38','青禾台球俱乐部','拜访已结束 · 查看拜访记录','visit-link')}${event('10:20','轨迹缺失','10:20–10:36 · 待补充说明','case')}${event('11:14','星河运动馆','拜访已结束 · 查看拜访记录','visit-link')}</div>`}`)}
function event(t,title,sub,target){return `<button class="event" onclick="${target==='visit-link'?"toast('此处进入已确认的 V3 拜访详情；本轮不重复改变拜访设计')":target?`go('${target}')`:"toast('签到记录')"}"><time>${t}</time><span class="grow"><p>${title}</p><small>${sub}</small></span>${target?icon('arrow','chev'):''}</button>`}
function overlay(base,title,body,dialog=false){return base+`<div class="overlay ${dialog?'dialog-overlay':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="${dialog?'dialog':'sheet'}">${dialog?`<h2>${title}</h2>`:`<div class="sheet-head"><h2>${title}</h2>${btn(icon('close'),'back()','icon-btn','aria-label="关闭"')}</div>`}${body}</div></div>`}
function voiceIntro(registered){return page('声音登记',banner(registered?'已完成声音登记':'尚未登记',registered?'用于本公司拜访录音身份识别':'录制一段声音，帮助识别你的姓名',registered?'check':'mic')+data('登记人','张松')+`<div class="article"><h2>登记后会发生什么</h2><p>拜访录音中识别到你的声音时，会显示你的姓名。无法可靠识别的片段仍保留匿名标记。</p><h2>你可以随时删除</h2><p>删除后，不再使用这份声音特征进行后续识别。历史拜访记录保持不变。</p></div>${registered?btn('删除声音登记',"go('voice-delete')",'text-button danger','style="padding-left:0;margin-top:18px"'):`<label class="consent"><input type="checkbox" ${consent?'checked':''} onchange="consent=this.checked;document.getElementById('beginVoice').disabled=!consent"><span>我同意将本次声音特征用于本公司拜访录音身份识别，可随时删除登记。</span></label>`}`,registered?btn('重新登记',"consent=false;go('voice-new')",'secondary'):btn('开始录制',"startVoice()",'primary',`id="beginVoice" ${consent?'':'disabled'}`))}
function startVoice(){seconds=0;go('voice-record');timer=setInterval(()=>{seconds++;const el=document.getElementById('voiceTime');if(el)el.textContent='00:'+String(seconds).padStart(2,'0');if(seconds>=30){clearInterval(timer);timer=null;go('voice-review')}},1000)}
function voiceRecording(){return page('录制声音',`<div class="between"><h2>按平时语速朗读</h2><span class="badge orange">正在录音</span></div><p class="note">请在安静环境中独自朗读，建议 20–30 秒。</p><div class="reading">您好，我是张松。今天到店了解一下经营情况，您店里目前有多少张球台？平时客人主要在什么时间过来？我们可以围绕门店推广、零售商品和经营服务，结合您的需要一起沟通。</div><div class="clock" id="voiceTime">00:${String(seconds).padStart(2,'0')}</div><div class="wave">${[10,20,30,18,38,26,14,30,20,10].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><p class="clock-caption">最长 30 秒，完成后请确认登记</p>`,btn('结束录音',"if(seconds<15){toast('录音至少需要15秒，请继续朗读')}else{go('voice-review')}",'primary'))}
function sync(s){const pending=s!=='sync';return page('材料同步',banner(s==='sync'?'材料已同步':s==='syncing'?'正在同步':'有材料待同步',pending?'2 次拜访 · 本机材料已保存':'当前账号暂无待同步材料',pending?'sync':'check')+`<div class="panel"><h3>${pending?'保持网络连接':'材料状态正常'}</h3><p class="note" style="margin-top:8px">${pending?'照片和录音同步完成后，服务器才有完整材料进行核验。请保留本机材料。':'同步完成表示材料已上传，不代表拜访已经通过有效性核验。'}</p></div>${pending?data('当前状态',s==='syncing'?'正在上传，请稍候':'网络恢复后可重新同步'):''}${row('同步遇到问题','','faq-sync','help')}`,pending?btn(s==='syncing'?'正在同步…':'重新同步',"go('syncing');setTimeout(()=>{if(state==='syncing'){state='sync';render();toast('原型演示：同步完成')}},1800)",'primary',s==='syncing'?'disabled':''):'')}
function settings(){return page('设置',`<div class="section-title" style="margin-top:0">账号</div>${row('个人资料','张松','identity','user')}<div class="section-title">应用</div>${row('应用权限','','permissions','shield')}${row('关于销售工作台','0.2.1','about','info')}<div class="rule"></div>${btn('退出登录',"go('logout')",'secondary')}<p class="note">退出后，本机草稿仍按账号保留。</p>`)}
const faqs={
'faq-visit':['什么情况下算有效拜访？',[['满足本次拜访规则','需要符合到店、沟通结果、停留、照片和录音等条件，由服务端核验后确定。'],['录音时长单独计算','当前默认规则要求累计录音至少 10 分钟。停留满 10 分钟不代表录音已满；具体门槛以本次拜访采用的规则为准。'],['提交后查看结果','照片与录音可能仍在同步。请在拜访详情查看核验结果，未通过时按页面说明处理。']]],
'faq-sync':['材料一直没有同步怎么办？',[['先检查网络','恢复稳定网络后，在材料同步页重试。不要删除本机文件或卸载应用。'],['分清三个状态','本机已保存：文件仍在手机。已同步：服务器已收到材料。拜访已提交：业务结果已保存。三者不能互相替代。'],['退出账号之后','本机材料按账号保存，重新登录原账号后继续处理。切换账号不会转交这份材料。']]],
'faq-voice':['声音登记有什么作用？',[['识别本人声音','登记用于本公司拜访录音中的姓名标记，不用于判断拜访是否有效。'],['一次独立朗读','在安静环境录制 20–30 秒。录制被电话等打断时重新录制；上传成功后才算完成登记。'],['识别不一定完全准确','噪音、重叠语音和短句可能无法可靠区分。可以重新登记，也可在声音登记页删除。']]],
'faq-account':['个人资料不正确怎么办？',[['公司统一维护','姓名、工号与账号归属来自公司员工档案。请联系公司管理员核对，不在 APP 自行创建第二份身份。'],['身份暂时无法确认','进入个人资料后重新查询。读取失败不代表账号被停用，也不代表没有销售权限。'],['无需重复登记销售身份','已有员工由系统按账号自动识别；无法确认时，应先核对原员工档案。']]]};
function article(s){const a=faqs[s];return page('使用帮助',`<article class="article"><h1>${a[0]}</h1>${a[1].map(([h,p])=>`<h2>${h}</h2><p>${p}</p>`).join('')}</article>`)}
function content(s){
if(s==='home'||s==='home-alert')return home(s==='home-alert');
if(s==='identity'||s==='identity-error')return page('个人资料',`<div class="identity" style="padding-top:0"><span class="avatar">张</span><div><h2>张松</h2><small>瑞盖文化传媒</small></div></div>${data('姓名','张松')}${data('公司','瑞盖文化传媒')}${data('登录账号','zhangsong')}${data('员工编号',s==='identity-error'?'暂未确认':'RG0268')}${s==='identity-error'?`<div class="callout" style="margin-top:20px"><span>暂时无法确认员工身份</span>${btn('重新查询',"state='identity';render()")}</div>`:''}<p class="note">个人资料由公司统一维护。如有变化，请联系公司管理员。</p>`);
if(s==='work'||s==='work-empty')return work(s==='work-empty');
if(s==='date')return overlay(work(),'选择日期',`<div class="between"><strong>2026 年 11 月</strong><small>系统日期控件示意</small></div><div class="calendar">${'一二三四五六日'.split('').map(d=>`<small>${d}</small>`).join('')}${Array.from({length:30},(_,i)=>btn(i+1,`state='${i===16?'work':'work-empty'}';render()`,i===16?'selected':'',i>16?'disabled':'')).join('')}</div>`);
if(s==='route')return nav('当日轨迹')+map(true)+`<div class="foot"><div class="between"><h3>11月17日</h3><small>已记录 8.6 km · 估算</small></div><p class="note" style="margin:6px 0">虚线表示缺失时段，不能视为已确认行程。</p>${row('10:20–10:36 轨迹缺失','查看','case')}</div><div class="gesture"></div>`;
if(s==='case'||s==='case-sent')return page('核查事项',`<span class="badge orange">${s==='case-sent'?'已提交说明':'待补充说明'}</span><h1 style="margin:14px 0 8px">一段轨迹待核查</h1><small>11月17日 · 10:20–10:36</small><div class="panel"><p style="font-size:14px">该时段未收到连续有效位置，请补充实际情况，供公司核查。</p></div>${s==='case-sent'?`<h3>说明与处理</h3><div class="data-row" style="display:block"><div class="between"><strong>我的说明</strong><small>刚刚</small></div><p style="margin-top:8px">${esc(note||'地下室信号弱，期间在店内与负责人沟通。')}</p></div><p class="note">说明已提交，等待核查；这不是最终处理结果。</p>`:'<p class="note">轨迹缺失不直接代表旷工或未拜访。</p>'}`,btn(s==='case-sent'?'补充说明':'填写说明',"go('statement')",'primary'));
if(s==='statement')return page('补充说明',`<h3>11月17日 · 10:20–10:36</h3><p class="note" style="margin-top:6px">轨迹缺失</p>${row('原因',reason||'请选择（选填）','reason')}<label class="field"><span>实际情况 <span class="danger" style="display:inline">*</span></span><textarea id="statementText" maxlength="1900" placeholder="请说明该时段的真实情况" oninput="note=this.value;document.getElementById('counter').textContent=this.value.length+'/1900'">${esc(note)}</textarea><span class="counter" id="counter">${note.length}/1900</span></label><p class="note">提交后供公司核查，不会立即改变外勤结果。</p><p id="formError" class="error-text"></p>`,btn('提交说明',"if(!note.trim()){document.getElementById('formError').textContent='请填写实际情况';document.getElementById('statementText').focus()}else{state='case-sent';render();toast('原型演示：说明已提交')}",'primary'));
if(s==='reason')return overlay(content('statement'),'选择原因', ['地下室信号弱','网络中断','定位权限或系统限制','设备临时异常','其他'].map(r=>btn(r,`reason='${r}';back()`,'menu')).join(''));
if(s==='voice')return voiceIntro(true);if(s==='voice-new')return voiceIntro(false);if(s==='voice-record')return voiceRecording();
if(s==='voice-review'||s==='voice-error')return page('确认声音登记',banner('录音已完成','样本保存在本机，确认后提交','mic')+data('登记人','张松')+data('录音时长',(seconds||26)+' 秒')+`<p class="note">确认后将替换已有声音登记。提交失败时，原登记继续保留。</p>${s==='voice-error'?'<div class="callout" style="margin-top:20px">登记未完成，请检查网络后重试。</div>':''}`,btn(s==='voice-error'?'重试登记':'确认登记',"voiceRegistered=true;state='voice';render();toast('原型演示：声音已登记')",'primary')+btn('重新录制',"startVoice()",'text-button','style="width:100%"'));
if(s==='voice-delete')return overlay(voiceIntro(true),'删除声音登记？',`<p>之后不再使用这份声音特征识别你的姓名，历史拜访记录保留。</p><div class="two-actions">${btn('保留','back()','secondary')}${btn('删除登记',"voiceRegistered=false;consent=false;state='voice-new';render();toast('原型演示：已删除登记')",'primary')}</div>`,true);
if(['sync','sync-pending','syncing'].includes(s))return sync(s);
if(s==='settings')return settings();
if(s==='permissions')return page('应用权限',`<p class="muted" style="font-size:14px">仅在相关功能使用时申请，授权由手机系统管理。</p>${row('定位','查看用途','permission-location','pin','到店签到、拍照与外勤轨迹')}${row('麦克风','查看用途','permission-mic','mic','拜访录音与声音登记')}${row('相机','查看用途','permission-camera','camera','拍摄现场照片')}<p class="note">这里不代替系统权限开关。</p>`,btn('前往系统设置',"toast('原型示意：打开本应用的系统设置')",'secondary'));
if(s.startsWith('permission-')){const mic=s==='permission-mic',cam=s==='permission-camera';return page((mic?'麦克风':cam?'相机':'定位')+'权限',`<h1>${mic?'用于现场录音':cam?'用于拍摄拜访照片':'用于确认现场位置'}</h1><div class="article"><h2>什么时候使用</h2><p>${mic?'开始拜访录音或声音登记时，使用麦克风。':cam?'点击拍照时打开系统相机，返回后保存到当前拜访。':'签到、开始或结束拜访、拍照时确认位置；外勤期间按公司规则记录轨迹。'}</p><h2>功能无法正常使用时</h2><p>进入系统设置检查本应用的权限。修改后返回 APP，重新执行刚才的操作。</p><h2>注意</h2><p>${mic?'被电话或其他录音应用打断后，请按页面提示恢复。':cam?'拍摄完成前不要连续重复点击；已保存照片会继续同步。':'定位信号弱或系统限制可能导致轨迹中断；缺失位置不能当作已确认行程。'}</p></div>`,btn('前往系统设置',"toast('原型示意：打开系统应用设置，实际平台能力在开发时验证')",'primary'))}
if(s==='about')return page('关于销售工作台',`<div class="about-brand"><img class="brand-mark" src="brand.png" alt="瑞盖销售工作台"><h2>销售工作台</h2><p class="note" style="margin-top:4px">瑞盖 · 企业内部应用</p></div>${data('当前版本','0.2.1')}${row('使用帮助','','help')}${row('应用权限说明','','permissions')}<p class="note">账号与业务资料由所属公司管理。</p>`);
if(s==='logout')return overlay(settings(),'退出当前账号？',`<p>本机草稿和待同步材料按账号保留。重新登录当前账号后可继续处理。</p><div class="two-actions">${btn('取消','back()','secondary')}${btn('退出登录',"back();toast('原型演示：退出后进入既有登录页，未操作真实账号')",'primary')}</div>`,true);
if(s==='logout-blocked')return overlay(settings(),'当前还有拜访录音',`<p>请先在拜访页面结束并保存录音，再退出登录。</p>${btn('知道了','back()','primary')}`,true);
if(s==='logout-error')return page('设置',`<div class="callout">退出未完成，当前账号仍保持登录。</div><p class="note">登录凭据尚未清除，请重试。</p>${btn('重试退出',"go('logout')",'secondary','style="margin-top:20px"')}`);
if(s==='help')return page('使用帮助',`<h1 style="font-size:24px;margin-bottom:16px">常见问题</h1>${Object.entries(faqs).map(([k,v])=>row(v[0],'',k)).join('')}<div class="rule"></div>${row('定位、录音或拍照异常','','permissions','shield')}<p class="note">账号、员工资料或业务权限问题，请联系公司管理员。</p>`);
if(faqs[s])return article(s);
if(s==='load-error')return page('个人资料',empty('暂时无法读取','请检查网络后重试，原有账号信息不会被清除。',"state='identity';render()"));
