function form(mode='form'){
let no=mode==='uncontacted'||model.outcome==='未接触',bad=mode==='validation';
let recording=mode==='interrupted'?`<div class="callout">录音已中断 · 已保存 12:36 ${btn('恢复录音',"toast('演示：录音已恢复');go('form')")}</div>`:`<button class="recordbar" onclick="go('recordcontrol')"><span class="dot"></span><span class="grow">录音中 <strong>12:36</strong></span><span class="muted">查看状态</span>${ico('right')}</button>`;
let outcome=`<div class="segment"><button class="${!no?'on':''}" onclick="model.outcome='已沟通';state='form';render()">已沟通</button><button class="${no?'on':''}" onclick="model.outcome='未接触';state='uncontacted';render()">未接触</button></div>`;
let communication=no?row('未接触原因',model.reason,'reason',true)+(model.reason==='其他原因'?'<label class="field">原因说明 <span class="req">*</span><textarea class="textinput" placeholder="请补充现场实际情况"></textarea></label>':''):row('接待人',bad?'请选择':model.person,'people',true)+(bad?'<p class="error">请选择本次接待人</p>':'')+`<div class="sectionhead" style="margin:14px 0 4px"><span>业务进展 <span class="req">*</span></span>${btn('＋ 添加',"go('business')")}</div>`+(model.business?`<div class="biz"><span class="grow">${model.business}</span>${btn(model.progress+' ›',"go('progress')")}${btn(ico('close'),"model.business='';render()",'iconbtn')}</div>`:btn((model.progress==='暂无合作意向'?'✓ ':'')+'暂无合作意向',"model.progress='暂无合作意向';render()",model.progress==='暂无合作意向'?'secondary accent':'secondary'));
let photos=`<div class="photos">${model.photo&&!bad?photoThumb():''}<button class="photo capture" onclick="go('camera')">${ico('camera')}拍照</button></div>${bad?'<p class="error">请拍摄至少 1 张门头照片</p>':'<p class="hint">至少 1 张现场照片</p>'}${mode==='sync'?`<div class="callout">1 张照片待同步 · 已保存在本机<br>${btn('重新同步',"toast('演示：同步成功');state='form';render()")}</div>`:''}`;
return nav('拜访中')+`<div class="body">${store()}${recording}${bad?'<div class="callout">还有 2 项必填内容未完成</div>':''}${sec('01','门店现状',row('营业状态',model.status,'status',true)+(model.status.includes('停业')?'<label class="field">停业依据 <span class="req">*</span><textarea class="textinput" placeholder="如现场告示、负责人确认"></textarea></label>':'')+row('经营类型',model.type,'type',true))}${sec('02','本次沟通',outcome+communication)}${sec('03','现场照片',photos,`<small>${bad?0:model.photo?1:0} 张</small>`)}${sec('04','后续跟进',row('下次行动',model.followup||'请选择','followup')+row('跟进日期',model.date||'请选择','date')+`<label class="field" style="margin-top:16px"><span>补充记录 <small>选填</small></span><textarea class="textinput" placeholder="记录沟通要点或后续安排" oninput="model.note=this.value">${model.note}</textarea></label><small>✓ 草稿已保存在本机</small>`,btn('清除',"model.followup='';model.date='';render()"))}</div>`+footer(mode==='submitting'?'正在保存拜访…':'完成拜访',mode==='submitting'?"toast('正在保存，请勿重复提交')":"go('submitting');setTimeout(()=>{if(state==='submitting'){state='saved';render()}},1600)",true);
}
const resultCard=(title,reason,type,target)=>`<button class="result ${type}" onclick="go('${target}')"><span class="stateicon">${type==='danger'?'!':type==='warning'?'·':'✓'}</span><span class="grow"><strong>${title}</strong><small>${reason}</small></span>${ico('right')}</button>`;
function detail(mode='detail'){let pending=mode==='saved',cancelled=mode==='cancelled';return nav('拜访详情')+`<div class="body">${store(true)}${resultCard(cancelled?'拜访已取消':pending?'自动核验中':'核验通过',cancelled?'本次未计为完成拜访':pending?'拜访已提交，核验结果稍后更新':'客观条件已满足',pending||cancelled?'warning':'',cancelled?'cancelled':pending?'pending':'verification')}${cancelled?'<p class="muted" style="margin-top:20px">已保存的录音仍可查看。</p>':`${sec('','沟通记录',kv('沟通结果','已沟通')+kv('接待人','张店长 · 店长')+kv('零售','高意向')+`<div class="note">${model.note||'已介绍产品与供货方式，对方希望先了解常用耗材报价，再安排下一次沟通。'}</div>`)}${sec('','门店现状',kv('营业状态','营业中')+kv('经营类型','商业娱乐'))}`}${sec('','现场材料',`${!cancelled?`<div class="photos">${photoThumb()}</div>`:''}<button class="audioentry" onclick="go('transcript')">${ico('mic')}<span class="grow"><strong>录音与原文</strong><small>完整录音 · 28:16</small></span>${ico('right')}</button>`)}${!cancelled?sec('','后续跟进',kv('下次行动','发送方案')+kv('跟进日期','2026年11月20日')):''}</div>`}
const dictionaries={status:['营业中','暂时停业','已停业','待核实'],type:['商业娱乐','竞技赛事','培训教育','综合经营','其他','暂未核实'],business:['高德','零售','周边','鹰眼'],role:['老板','店长','前台','教练','其他'],reason:['负责人不在','未到营业时间','门店暂时停业','对方暂不接待','其他原因'],followup:['发送方案','提供报价','安排体验','再次到店','合作回访','其他安排']};
function choose(key,value){model[key]=value;if(key==='role'){state='newperson';render();return}closeSheet()}
function sheetWrap(title,body){return `<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheethead"><h2>${title}</h2>${btn(ico('close'),'closeSheet()','iconbtn')}</div>${body}</section></div>`}
function sheet(s){let title=screens.find(x=>x[1]===s)?.[2]||'录音状态',body='';
if(dictionaries[s]){body=dictionaries[s].map(t=>`<button class="choice ${model[s]===t?'on':''}" onclick="choose('${s}','${t}')">${t}${model[s]===t?'<span class="tick">✓</span>':''}</button>`).join('')}
if(s==='progress')body=`<small>合作意向</small>${['高意向','中意向','低意向','暂无意向'].map(t=>`<button class="choice ${model.progress===t?'on':''}" onclick="choose('progress','${t}')">${t}${model.progress===t?'<span class="tick">✓</span>':''}</button>`).join('')}<div style="margin-top:18px"><small>合作关系</small><button class="choice" onclick="choose('progress','已合作')">已合作</button></div>`;
if(s==='people')body=`<p class="muted">选择本次实际接待人员，可多选</p>${['张店长','李先生'].map((n,i)=>`<button class="person" onclick="selected=selected.includes('${n}')?selected.filter(x=>x!=='${n}'):selected.concat('${n}');render()"><span class="avatar">${n[0]}</span><span class="grow"><strong>${n}</strong><small style="display:block">${i?'老板':'店长'}</small></span><span class="checkbox ${selected.includes(n)?'checked':''}">${selected.includes(n)?'✓':''}</span></button>`).join('')}${btn('＋ 新增接待人',"go('newperson')")}${btn('确定'+(selected.length?' · '+selected.length+'人':''),"model.person=selected.length?selected.join('、'):'请选择';closeSheet()",'primary')}`;
if(s==='newperson')body=`<label class="field"><span>姓名或称呼 <span class="req">*</span></span><input id="personName" class="textinput" placeholder="如张店长、前台小李" value="${model.newname||''}" oninput="model.newname=this.value"></label>${row('门店角色',model.role||'请选择','role',true)}<label class="field" style="margin-top:14px"><span>电话 <small>选填</small></span><input class="textinput" type="tel" placeholder="填写电话号码" value="${model.phone||''}" oninput="model.phone=this.value"></label><label class="field"><span>微信线索 <small>选填</small></span><input class="textinput" placeholder="微信号或其他线索" value="${model.wechat||''}" oninput="model.wechat=this.value"></label>${btn('保存并选中',"if(!model.newname||!model.role){toast('请填写姓名并选择角色')}else{model.person=model.newname+' · '+model.role;state='form';stack=[];render();toast('已保存并选中')}",'primary')}`;
if(s==='date')body=`<div class="row"><strong>2026年11月</strong><span class="muted">系统日期选择器示意</span></div><div class="calendar">${'一二三四五六日'.split('').map(d=>`<small>${d}</small>`).join('')}${Array.from({length:30},(_,i)=>`<button class="${i===19?'on':''}" onclick="choose('date','2026-11-${String(i+1).padStart(2,'0')}')">${i+1}</button>`).join('')}</div>`;
if(s==='recordcontrol')body=`<div class="result"><span class="dot"></span><strong>录音中 · 累计 12:36</strong></div><p class="muted" style="margin-top:16px">本次拜访自动录音，完成或取消拜访后停止。</p>${btn('收起','closeSheet()','primary')}`;
if(s==='camera')body=`<div class="empty">${ico('camera')}<h3>正在打开系统相机</h3><p class="muted">此处由手机原生相机接管</p></div>${btn('模拟拍摄返回',"model.photo=true;state='form';render();toast('照片已保存，正在同步')",'primary')}`;
return form(s==='reason'?'uncontacted':'form')+sheetWrap(title,body)}
function evidence(s){let tab=s==='recording'?'录音':'原文',empty=s==='audioempty';let text=s==='transcribing'?`<div class="empty">${ico('file')}<h3>原文处理中</h3><p class="muted">录音已保存，可先收听完整录音。</p>${btn('刷新原文',"state='transcript';render()")}</div>`:s==='audioempty'?`<div class="empty">${ico('mic')}<h3>暂无已同步录音</h3><p class="muted">材料同步完成后会在这里显示。</p>${btn('刷新',"toast('演示：仍暂无已同步录音')",'secondary')}</div>`:s==='recording'?`<div class="result"><span>${ico('mic')}</span><span class="grow"><strong>本次拜访完整录音</strong><small>11月17日 14:20 · 28:16</small></span></div><p class="muted" style="margin-top:22px;line-height:1.8">分段录音会连续播放，可拖动下方进度条定位。</p>`:[['00:00','销售','您好，今天过来了解一下门店的耗材采购情况。'],['01:24','接待人','我们平时主要关注稳定供货，先发一份常用产品的报价吧。'],['02:08','销售','好的，我整理后发给您，再约时间详细沟通。'],['03:36','接待人','可以，下周再联系。']].map((r,i)=>`<button class="transcript ${i===1?'on':''}" onclick="playing=true;position=${i*84};render()"><time>${r[0]}</time><span><small>${r[1]}</small><p>${r[2]}</p></span></button>`).join('');return nav('录音与原文',true)+`<div style="padding:18px 20px 14px"><h3>青禾台球俱乐部</h3><small>11月17日 14:20 · ${empty?'暂无录音':'28:16'}</small></div><div class="tabs">${['原文','录音'].map(t=>btn(t,`state='${t==='录音'?'recording':'transcript'}';render()`,tab===t?'on':'')).join('')}</div><div class="body">${text}</div>${!empty?`<div class="player"><input type="range" aria-label="播放进度" min="0" max="1696" value="${position}" oninput="position=this.value;document.getElementById('playTime').textContent=String(Math.floor(position/60)).padStart(2,'0')+':'+String(position%60).padStart(2,'0')"><div class="playerline"><small id="playTime">01:24</small>${btn(ico(playing?'pause':'play'),"playing=!playing;render()",'play')}<small>28:16</small></div></div>`:''}`}
function verification(s){let map={verification:['核验通过','客观条件已满足',''],failed:['核验未通过','未满足本次拜访的录音要求','danger'],insufficient:['证据不足','现有材料不足以确认有效拜访','warning'],pending:['自动核验中','拜访已提交，正在核验现场材料','warning'],appealed:['申诉处理中','申诉已提交，请等待核实结果','warning'],resolved:['核验通过','申诉已处理，确认本次拜访有效',''],verifyerror:['处理异常','系统处理未完成，原始录音已保留','warning']};let r=map[s];let history=['appealed','resolved'].includes(s);return nav('拜访核验',true)+`<div class="body"><h3>青禾台球俱乐部</h3><small>11月17日 14:20–14:48</small><div class="result ${r[2]}"><span class="stateicon">${r[2]==='danger'?'!':r[2]==='warning'?'·':'✓'}</span><span class="grow"><strong>${r[0]}</strong></span></div>${sec('','核验说明',`<p style="font-size:15px;line-height:1.9">${r[1]}</p>`)}${row('录音与原文','查看','transcript')}${history?sec('','申诉记录',`<div class="timeline">${s==='resolved'?`<div class="event"><strong>已处理 · 核验通过</strong><small style="display:block">11月17日 16:20</small><p>已结合原始录音核实，本次拜访符合要求。</p></div>`:''}<div class="event"><strong>${s==='appealed'?'处理中':'已提交申诉'}</strong><small style="display:block">11月17日 15:02</small><p>本次已实际到店并与店长沟通，请结合完整录音重新核实。</p></div></div>`):''}</div>${['failed','insufficient'].includes(s)?footer('发起申诉',"go('appeal')"):''}`}
function appeal(){return nav('填写申诉')+`<div class="body"><h3>青禾台球俱乐部</h3><div class="callout">核验未通过 · 未满足本次拜访的录音要求</div><label class="field" style="margin-top:24px"><span>申诉原因 <span class="req">*</span></span><textarea id="appealReason" class="textinput" style="height:220px" maxlength="2000" placeholder="说明实际到店及沟通情况，便于重新核实" oninput="document.getElementById('count').textContent=this.value.length+'/2000'">本次已实际到店并与店长沟通，请结合完整录音重新核实。</textarea></label><div style="text-align:right"><small id="count">33/2000</small></div>${row('录音与原文','查看','transcript')}</div>`+footer('提交申诉',"if(!document.getElementById('appealReason').value.trim()){toast('请填写申诉原因')}else{state='appealed';render();toast('申诉已提交')}")}
function content(s){if(s==='closed'){model.status='暂时停业';return form()}if(s==='otherreason'){model.reason='其他原因';return form('uncontacted')}if(s==='nointention'){model.business='';model.progress='暂无合作意向';return form()}if(['form','uncontacted','validation','sync','interrupted','submitting'].includes(s))return form(s);if(['detail','saved','cancelled'].includes(s))return detail(s);if(['recording','transcript','transcribing','audioempty'].includes(s))return evidence(s);if(['verification','failed','insufficient','pending','appealed','resolved','verifyerror'].includes(s))return verification(s);if(s==='appeal')return appeal();if(s==='photo')return `<div class="dark" style="display:flex;flex-direction:column;height:100%">${nav('1 / 1')}<div class="photofull"><div>${ico('image')}现场门头照片<br><small>设计占位 · 不使用真实门店照片</small></div></div><div class="photocaption">拍摄于 11月17日 14:32</div></div>`;if(s==='cancel')return form()+`<div class="overlay"><div class="dialog" role="dialog" aria-label="取消本次拜访"><h2>取消本次拜访？</h2><p>取消后将停止录音，本次不计为完成拜访。已保存的材料仍会保留。</p><div class="dialogactions">${btn('继续拜访','closeSheet()','secondary')}${btn('取消拜访',"state='cancelled';render()",'primary')}</div></div></div>`;if(s==='loaderror')return nav('拜访详情')+`<div class="body"><div class="empty">${ico('refresh')}<h3>暂时无法加载拜访</h3><p class="muted">请检查网络后重试。</p>${btn('重新加载',"state='detail';render()",'primary')}</div></div>`;return sheet(s)}
function render(){let info=screens.find(x=>x[1]===state)||['','',state,''];document.getElementById('pageTitle').textContent=info[2];document.getElementById('stage').innerHTML=`<div class="review"><div class="device">${content(state)}</div><aside class="annotation"><div class="eyebrow">${info[0]} / REVIEW</div><h2>${info[2]}</h2><p>${info[3]}</p><hr><p>点按手机中的入口可继续浏览。左侧目录可直接查看各个页面、弹窗与异常状态。</p><small>示例文案、联系人、录音和字典值仅用于设计评审；没有提交真实业务。</small><hr><a href="?view=all">查看全部页面设计 →</a></aside></div>`;document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('selected',b.dataset.screen===state));if(state==='submitting')document.querySelector('.foot .primary').disabled=true;}
let group='';document.getElementById('menu').innerHTML=btn('全部设计稿',"location.href='?view=all'")+screens.map(x=>(group!==x[0]?(group=x[0],`<div class="group">${x[0]}</div>`):'')+`<button data-screen="${x[1]}" onclick="state='${x[1]}';stack=[];render()">${x[2]}</button>`).join('');
if(q.get('view')==='all'){let groups=[...new Set(screens.map(s=>s[0]))];document.getElementById('stage').innerHTML=`<div class="overview"><div class="callout">设计评审 V3 · 共 ${screens.length} 个页面与状态。下方设计稿可内部滚动、点按；点击标题进入单屏评审。</div>${groups.map(g=>`<h2>${g}</h2><p>${screens.filter(s=>s[0]===g).length} 个设计视图</p><div class="grid">${screens.filter(s=>s[0]===g).map(x=>`<article class="tile"><a href="?screen=${x[1]}">${x[2]} <span>↗</span></a><iframe loading="lazy" title="${x[2]}" src="?frame=1&screen=${x[1]}"></iframe><small>${x[3]}</small></article>`).join('')}</div>`).join('')}</div>`}else render();
window.addEventListener('keydown',e=>{const modal=document.querySelector('.overlay');if(e.key==='Escape'&&modal)closeSheet();if(e.key==='Tab'&&modal){const f=[...modal.querySelectorAll('button,input,textarea')].filter(x=>!x.disabled);if(f.length&&(!modal.contains(document.activeElement)||(e.shiftKey&&document.activeElement===f[0])||(!e.shiftKey&&document.activeElement===f[f.length-1]))){e.preventDefault();(e.shiftKey?f[f.length-1]:f[0]).focus()}}});
</script></html>
