<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外勤记录 · 修订设计</title>
<style>
:root{--ink:#252a31;--muted:#687078;--line:#e8ebed;--bg:#f5f6f7;--accent:#c64c1c;--green:#287553;--red:#b42338}*{box-sizing:border-box}body{margin:0;background:#e9ecef;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink)}button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:active{background:#eff1f3}svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h1,h2,p{margin:0}.shell{max-width:1280px;margin:auto;padding:32px}.intro{margin-bottom:24px}.intro p{color:var(--muted);margin-top:8px}.intro h1{font-size:26px}.kicker{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:600;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.caption{margin-bottom:12px;font-weight:600}.caption small{font-weight:400;color:var(--muted);display:block;margin-top:4px}.phone{height:844px;background:#fff;border:1px solid #d9dfe4;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column}.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;font-weight:600;flex:none}.nav{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex:none;background:white}.nav strong{font-size:17px}.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;flex:none}.scroll{overflow:auto;flex:1;min-height:0}.date{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0}.date button{min-height:44px}.date b{font-size:14px;font-weight:500}.date em{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px}.summary{display:flex;align-items:center;padding:12px 20px 18px}.mile{flex:1.2;text-align:left;padding:0;min-height:56px}.metric{flex:1;padding-left:18px;border-left:1px solid var(--line)}.label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.num{font-size:29px;line-height:1.2;font-weight:600;letter-spacing:-.7px}.unit{font-size:12px;font-weight:400;margin-left:4px}.metric b{font-size:20px;font-weight:600;line-height:1.8}.muted{color:var(--muted)}.map-wrap{margin:0 16px;border-radius:12px;overflow:hidden;position:relative;height:224px;background:#f1f2ef}.map-svg{width:100%;height:100%;display:block}.map-expand{position:absolute;right:10px;bottom:12px;background:#fff;border:1px solid #e8ebed;box-shadow:0 2px 6px #00000008}.map-attribution{position:absolute;bottom:5px;left:8px;font-size:8px;color:#777e78;pointer-events:none}.legend{display:flex;align-items:center;gap:15px;padding:9px 20px 15px;font-size:10px;color:var(--muted)}.legend i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:4px}.legend .in{background:var(--green)}.legend .out{border-radius:1px;background:var(--red)}.section{border-top:6px solid var(--bg);padding:16px 20px 4px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:15px}.section span{font-size:11px;color:var(--muted)}.events{padding:0 20px 16px}.event{display:flex;gap:12px;position:relative;padding:14px 0}.when{width:39px;flex:none;font-size:11px;font-weight:500;color:var(--muted);padding-top:2px}.rail{position:relative;width:20px;flex:none}.rail:after{content:'';position:absolute;top:24px;bottom:-28px;left:9px;width:1px;background:#e3e6e8}.event:last-child .rail:after{display:none}.dot{display:block;margin-left:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}.dot.start{background:var(--green)}.dot-number{display:flex;width:20px;height:20px;margin:0;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:#fff;background:var(--accent);border-radius:50%}.dot.end{background:var(--red);border-radius:2px}.copy{flex:1;min-width:0}.copy strong{font-size:13px;font-weight:600;display:block}.copy p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}.copy .meta{color:#555e66}.visit-actions{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.visit-actions button{font-size:11px;color:var(--accent);min-height:32px;padding:4px 0}.visit-actions .locate{color:var(--muted)}.end-note{padding:0 20px 16px;color:var(--muted);font-size:11px}.gesture{height:16px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}.gesture:after{content:'';width:100px;height:4px;background:#252a31;border-radius:4px}.notice{margin:0 16px 12px;background:#fff7ef;color:#8a542e;padding:10px 12px;font-size:11px;border-radius:8px;display:flex;align-items:center;justify-content:space-between}.notice button{font-size:11px;color:#8a542e;text-decoration:underline;min-height:32px}.fullmap{flex:1;position:relative;min-height:0;background:#eff2ed}.fullmap .map-svg{height:100%}.fulltop{position:absolute;left:16px;right:16px;top:14px;display:flex;align-items:center;justify-content:space-between;background:#fffffff2;border-radius:10px;padding:12px 14px;box-shadow:0 2px 10px #00000005}.fulltop b{font-size:13px}.fulltop small{font-size:11px;color:var(--muted)}.record-open{position:absolute;bottom:22px;right:16px;min-height:44px;border:1px solid #e3e6e8;border-radius:10px;background:#fff;padding:0 16px;font-size:12px}.selected{padding:16px 20px;background:#fff}.selected .top{display:flex;align-items:center;justify-content:space-between}.selected strong{font-size:14px}.selected p{font-size:12px;color:var(--muted);margin-top:7px}.selected small{font-size:10px;color:var(--muted)}.selected button{color:var(--accent);min-height:32px;padding:0}.scrim{position:absolute;inset:82px 0 0;background:#18232c35;display:flex;align-items:flex-end;z-index:4}.sheet{background:#fff;border-radius:18px 18px 0 0;padding:8px 20px 20px;width:100%;max-height:80%;overflow:auto}.sheet h2{font-size:16px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet p{font-size:13px;line-height:1.8;color:var(--muted);margin:12px 0}.route-choice{display:block;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:14px 0;min-height:60px}.route-choice b{font-size:13px;display:block}.route-choice small{font-size:11px;color:var(--muted)}.empty-map{height:180px;margin:0 16px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}.frame .shell{padding:0}.frame .intro{display:none}.frame .grid{display:block}.frame .phone{width:100%;height:100dvh;border:0;border-radius:0}.frame .caption{display:none}.frame .tile{display:none}.frame .tile.active{display:block}@media(max-width:900px){.shell{padding:20px}.grid{grid-template-columns:1fr}.phone{max-width:390px;margin:auto}.caption{max-width:390px;margin:0 auto 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div class="shell"><div class="intro"><div class="kicker">RIGOUR SALES / FIELDWORK V3</div><h1>沿着 1、2、3，看清一天的拜访。</h1><p>修订评审稿 · 数据与道路均为示例，未替换 App。数字圆标直接代表门店；中文签到签退；一条路线、一份记录。</p></div><div class="grid" id="grid"></div></div>
<script>
const icons={back:'<path d="m14 5-7 7 7 7"/>',next:'<path d="m10 5 7 7-7 7"/>',expand:'<path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};const icon=k=>`<svg class="icon" viewBox="0 0 24 24">${icons[k]}</svg>`;
let selectedLeg=2;const legs=[{title:'签到地 → 青禾台球俱乐部',time:'09:02–09:38',km:'2.4',path:'M65 218H108V111',arrows:'m83 213 7 5-7 5m20-60 5-7 5 7'},{title:'青禾台球俱乐部 → 星河运动馆',time:'10:06–11:14',km:'3.1',path:'M108 111H226',arrows:'m164 106 7 5-7 5'},{title:'星河运动馆 → 云际台球会所',time:'11:52–14:10',km:'3.1',path:'M226 111V218',arrows:'m221 158 5 7 5-7'},{title:'云际台球会所 → 签退地',time:'14:24–18:05',km:'4.0',path:'M226 218H263',arrows:'m242 213 7 5-7 5'}];function map(selected=false,partial=false,missing=false){return `<svg class="map-svg" viewBox="0 0 350 300" preserveAspectRatio="xMidYMid slice" aria-label="路线示意图"><rect x="0" y="-300" width="350" height="900" fill="#eef1ec"/><g stroke="#fff" stroke-width="14" fill="none"><path d="M108-300V0M226-300V0M108 300V600M226 300V600M0-70H350M0 360H350"/></g><g fill="#e3e8df"><rect x="22" y="20" width="70" height="75" rx="6"/><rect x="120" y="20" width="95" height="72" rx="6"/><rect x="239" y="24" width="86" height="68" rx="6"/><rect x="20" y="128" width="70" height="75" rx="6"/><rect x="123" y="126" width="86" height="75" rx="6"/><rect x="237" y="128" width="92" height="73" rx="6"/><rect x="22" y="234" width="68" height="70" rx="6"/><rect x="125" y="235" width="87" height="70" rx="6"/></g><path d="M0 111H350M108 0V300M226 0V300M0 218H350" stroke="#fff" stroke-width="20" fill="none"/><path d="M293 0v300" stroke="#d2e6e9" stroke-width="15"/><g fill="#8d958e" font-size="8" font-family="sans-serif"><text x="16" y="114">广渠门内大街</text><text x="134" y="221">光明路</text><text x="231" y="160" transform="rotate(90 231 160)">夕照寺街</text><text x="30" y="62">居住区</text><text x="135" y="168">运动中心</text></g><path d="M65 218H108V111H226V218H263" opacity="${missing?0:1}" stroke="${selected?'#c9d0d2':'#c64c1c'}" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${selected?`<path d="${legs[selectedLeg].path}" stroke="#c64c1c" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="${legs[selectedLeg].arrows}" fill="none" stroke="#fff" stroke-width="2"/>`:""}${partial?'<path d="M118 111H206" stroke="#fff" stroke-width="9"/>':''}${!selected&&!missing?'<path d="m103 166 5-7 5 7m60-60 7 5-7 5m53 51 5 7 5-7" fill="none" stroke="#fff" stroke-width="1.6"/>':''}<circle cx="65" cy="218" r="6" fill="#287553" stroke="#fff" stroke-width="3"/>
<g font-family="-apple-system,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">
<circle cx="108" cy="111" r="12" fill="#c64c1c" stroke="#fff" stroke-width="3"/><text x="108" y="115">1</text>
<circle cx="226" cy="111" r="12" fill="#c64c1c" stroke="#fff" stroke-width="3"/><text x="226" y="115">2</text>
<circle cx="226" cy="218" r="12" fill="#c64c1c" stroke="#fff" stroke-width="3"/><text x="226" y="222">3</text></g>
<rect x="257" y="212" width="12" height="12" rx="2" fill="#b42338" stroke="#fff" stroke-width="3"/></svg>`}
const status='<div class="status"><span>09:41</span><span>▮▮▮　▰</span></div>';function nav(title,full=false){return `${status}<div class="nav"><button class="ib" aria-label="返回" onclick="show('${full?'overview':'overview'}')">${icon('back')}</button><strong>${title}</strong><span class="ib"></span></div>`}const gesture='<div class="gesture"></div>';
function event(time,title,body,kind='visit',n=true){return `<div class="event"><div class="when">${time}</div><div class="rail">${kind==='visit'?`<i class="dot-number">${time==='09:38'?1:time==='11:14'?2:3}</i>`:`<i class="dot ${kind}"></i>`}</div><div class="copy"><strong>${title}</strong><p>${body}</p>${kind==='visit'?`<div class="visit-actions"><button onclick="detail('${title}')">查看拜访</button>${n?`<button class="locate" onclick="selectLeg(${time==='09:38'?0:time==='11:14'?1:2})">查看对应路段</button>`:''}</div>`:''}</div></div>`}
function events(mode='normal'){return `<div class="events">${event('09:02','签到','北京市东城区 · 广渠门外大街 16 号','start')}${event('09:38','青禾台球俱乐部','09:38–10:06　·　停留 28 分钟<br>广渠家园 7 号楼西侧地下一层','visit',mode!=='missing')}${event('11:14','星河运动馆','11:14–11:52　·　停留 38 分钟<br>夕照寺街 8 号院二层','visit',mode!=='missing')}${event('14:10','云际台球会所','14:10–14:24　·　停留 14 分钟<br>光明东路 13 号北玉大厦二层','visit',mode!=='missing')}${event('18:05','签退','北京市东城区 · 光明路 13 号','end')}</div>`}
function overview(mode='normal'){const none=mode==='missing',partial=mode==='partial';return `${nav('外勤记录')}<div class="scroll"><div class="date"><button class="ib" aria-label="前一天" onclick="show('partial')">${icon('back')}</button><button onclick="dates()"><b>11 月 17 日</b><em>周二</em></button><button class="ib" aria-label="后一天" onclick="show('overview')">${icon('next')}</button></div><div class="summary">${none?'':`<button class="mile" onclick="mileage('${mode}')"><span class="label">${partial?'已记录里程':'拜访里程'} ⓘ</span><span class="num">${none?'—':partial?'4.2':'12.6'}</span>${none?'':'<span class="unit">km</span>'}</button>`}<div class="metric"><span class="label">拜访次数</span><b>3<span class="unit">次</span></b></div><div class="metric"><span class="label">拜访停留</span><b>80<span class="unit">分钟</span></b></div></div>${none?'<div class="notice"><span>今日尚未记录行程</span><button onclick="mileage(\'missing\')">检查记录状态</button></div>':partial?'<div class="notice"><span>2 段定位缺失，里程仅含已记录部分</span><button onclick="mileage(\'partial\')">查看</button></div>':''}<div class="map-wrap">${map(false,partial,none)}<div class="map-attribution">地图仅作布局示意</div><button class="ib map-expand" aria-label="全屏地图" onclick="openMap('${mode}')">${icon('expand')}</button></div><div class="legend"><span><i class="in"></i>签到</span><span>数字为拜访顺序</span><span><i class="out"></i>签退</span></div><div class="section"><h2>当日记录</h2><span>按时间先后</span></div>${events(mode)}</div>${gesture}`}
function full(selected=false){return `${nav('当日行程',true)}<div class="fullmap">${map(selected,selectedMode==='partial',selectedMode==='missing').replace('viewBox="0 0 350 300"','viewBox="0 -150 350 600"').replace('xMidYMid slice','xMidYMid meet')}<div class="fulltop"><b>11 月 17 日 · 周二</b><small>${selectedMode==='missing'?'里程未生成':selectedMode==='partial'?'已记录 4.2 km':'12.6 km'}　·　3 次拜访</small></div><div class="map-attribution">地图与路线仅为示例</div>${selectedMode==='missing'?'':'<button class="record-open" onclick="records()">行程记录</button>'}</div>${selected?`<div class="selected"><div class="top"><strong>${legs[selectedLeg].title}</strong><button onclick="show('full')">取消选中</button></div><p>${legs[selectedLeg].time}　·　本段记录 ${legs[selectedLeg].km} km</p><small>橙色突出该时段，箭头表示方向；其他时段淡化。</small></div>`:''}${gesture}`}
const screens=[['overview','01 / 当日概览','首屏只保留里程、拜访、停留与地图。'],['full','02 / 全屏地图','放大同一份行程，不增加第二套模式。'],['selected','03 / 查看其中一段','数字与记录对应；突出当前段的方向与时间。'],['partial','04 / 部分轨迹缺失','里程明确标注为已记录部分。'],['missing','05 / 轨迹未记录','取消无意义里程占位，解释事实并给出恢复入口。']];let current='overview';let selectedMode='normal';const params=new URLSearchParams(location.search);const frame=params.has('frame');if(frame)document.body.classList.add('frame');
function contents(s){return s==='full'?full():s==='selected'?full(true):overview(s==='overview'?'normal':s)}
document.getElementById('grid').innerHTML=screens.map(([id,t,d])=>`<div class="tile" data-screen="${id}"><div class="caption">${t}<small>${d}</small></div><div class="phone" id="${id}">${contents(id)}</div></div>`).join('');
function show(s){current=s;if(frame){document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.screen===s))}else{document.getElementById(s).scrollIntoView({block:'center'})}document.querySelectorAll('.scrim').forEach(x=>x.remove())}show(params.get('screen')||'overview');
function sheet(html){const phone=document.getElementById(current);phone.insertAdjacentHTML('beforeend',`<div class="scrim" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="sheet-head"><h2>行程信息</h2><button class="ib" aria-label="关闭" onclick="this.closest('.scrim').remove()">${icon('close')}</button></div>${html}</div></div>`)}
function openMap(mode){selectedMode=mode;document.getElementById('full').innerHTML=full();show('full')}
function selectLeg(index){selectedLeg=index;document.getElementById('selected').innerHTML=full(true);show('selected')}
function records(){sheet(`<p>按发生时间选择，不用左右翻找。</p><button class="route-choice" onclick="show('full')"><b>全部行程</b><small>09:02–18:05 · 12.6 km</small></button>${legs.map((leg,i)=>`<button class="route-choice" onclick="selectLeg(${i})"><b>${leg.title}</b><small>${leg.time} · ${leg.km} km</small></button>`).join('')}`)}
function mileage(mode){sheet(`<h2>${mode==='missing'?'里程未生成':mode==='partial'?'仅统计已记录部分':'拜访里程 12.6 km'}</h2><p>${mode==='missing'?'当天没有收到轨迹定位点。地图仍显示签到和拜访位置；这些位置不能还原实际路程。':mode==='partial'?'已记录 4.2 km；两段缺失期间的路程未计入，不能当作全天完整里程。':'累计有效定位段的移动距离，属于记录估算。往返各按实际发生时段累计，不按地图线条数量计算。'}</p><p>仅有门店位置时不推算行驶路线，也不把地点间直线距离当作实际里程。</p>`)}
function dates(){sheet('<p>日期选择沿用系统日期控件。此处为界面设计示意。</p>')}
function detail(name){sheet(`<h2>${name}</h2><p>此入口打开原有已完成拜访详情；本次不重做拜访业务页面。</p>`)}
</script></html>
