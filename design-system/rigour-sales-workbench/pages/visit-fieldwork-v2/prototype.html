textarea::placeholder{color:var(--muted)}.help{font-size:13px;color:var(--muted);margin:6px 0}.body-space{padding-bottom:108px}.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:12px 20px max(16px,env(safe-area-inset-bottom));z-index:3}.primary{width:100%;border-radius:12px;background:var(--accent);color:white;font-weight:600;min-height:52px;padding:12px 16px}.secondary{min-height:48px;padding:12px 16px;width:100%;border:1px solid var(--control);border-radius:10px}.field-error{color:var(--error);font-size:14px;margin:4px 0 12px;line-height:1.5}.field-error:empty{display:none}.error-link{text-align:left;color:var(--error);min-height:44px;font-size:14px;width:100%}button[aria-invalid=true],input[aria-invalid=true],textarea[aria-invalid=true]{outline:1px solid var(--error);outline-offset:2px}.error{color:var(--error);font-size:14px;padding:10px 0}.optional{margin-top:14px;border-top:1px solid var(--line)}.optional summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}.optional summary::-webkit-details-marker{display:none}.text-input{border:1px solid var(--control);border-radius:8px;min-height:48px;padding:10px 12px;width:100%;background:white}.formfield{display:block;margin:14px 0}.formfield>span{display:block;font-size:14px;margin-bottom:8px}dialog{border:0;padding:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88dvh;position:fixed;inset:auto 0 0;margin:0 auto;color:var(--ink);background:white}dialog::backdrop{background:rgba(25,30,35,.32)}.sheet-top{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1}.sheet-body{padding:0 20px 20px}.sheet-footer{padding:12px 20px max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--line);position:sticky;bottom:0;background:white}.sheet-option{min-height:60px;display:flex;al <main class="body-space" id="main">
<header class="hero"><h1>谈小娱24h自助台球<br>（北玉大厦店）</h1><p>北苑路北玉大厦 2 层</p><div class="visit-state"><span class="muted">到店 14:08 <span style="padding:0 5px">·</span><b class="timer">12:36</b></span><button id="record" class="recording"><svg><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-3 0h6"/></svg><span id="recordText">录音中</span><svg><path d="m9 6 6 6-6 6"/></svg></button></div><div id="endBanner" class="end-banner" hidden>已自动结束拜访，结果待补充</div></header>
<section class="section"><div class="section-head"><h2>门店现状</h2></div><button class="row" id="status"><span class="row-label">营业状态<span class="req">*</span></span><span class="value"><span id="statusLabel">营业中</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><button class="row" id="type"><span class="row-label">经营类型<span class="req">*</span></span><span class="value"><span id="typeLabel">商业娱乐</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><div id="typeReason" hidden><label class="formfield"><span>其他经营类型<span class="req">*</span></span><input id="typeReasonInput" class="text-input" placeholder="请简要填写经营内容"></label></div><div id="statusReason" hidden><label class="formfield"><span>核实依据<span class="req">*</span></span><input id="statusReasonInput" class="text-input" placeholder="如：店主确认装修，预计下周恢复"></label></div></section>
<section class="section" id="communication"><div class="section-head"><h2>本次沟通<span class="req">*</span></h2></div><div id="outcomes" class="segments"></div><div id="contactedFields"><button class="row" id="person"><span class="row-label">接待人<span class="req">*</span></span><span class="value"><span id="personLabel">王先生 · 店长</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><div class="cooperation"><div class="section-head"><h2>合作进展<span class="req">*</span></h2><button class="text-action" id="addBusiness"><svg><path d="M12 5v14M5 12h14"/></svg>添加业务</button></div><div id="businesses"></div><button class="row muted" id="noIntent" hidden>选择合作情况</button></div></div><div id="uncontactedFields" hidden><button class="row" id="reason"><span>未接触原因<span class="req">*</span></span><span class="value"><span id="reasonLabel">请选择</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><div id="reasonOther" hidden><label class="formfield"><span>其他未接触原因<span class="req">*</span></span><input class="text-input" id="reasonOtherInput" placeholder="请简要说明本次情况"></label></div></div></section>
<section class="section" id="materials"><div class="section-head"><h2>现场照片<span class="req">*</span></h2><span class="muted small" id="photoCount">0 / 1 张</span></div><div class="photo-grid"><button class="photo" id="photo"><svg><path d="M8 5 10 2h4l2 3h4v15H4V5Z"/><circle cx="12" cy="12" r="4"/></svg><span>拍门头照</span></button></div></section>
<section class="section" id="followup"><div class="section-head"><h2>后续跟进</h2><span class="muted small">有安排再填</span></div><button class="row" id="nextAction"><span>下步行动<span class="req" id="actionReq">*</span></span><span class="value"><span id="nextActionLabel">发送方案</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><button class="row" id="nextDate"><span>跟进时间<span class="req" id="dateReq">*</span></span><span class="value"><span id="dateLabel">明天 10:00</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button><label class="formfield"><span>补充记录 <span class="muted">选填</span></span><textarea id="note" class="textarea" placeholder="记录关键需求、顾虑或约定">店长关注线上引流，明天发高德合作方案。</textarea></label><details class="optional"><summary>更多经营信息 <span>＋</span></summary><label class="formfield"><span>台桌数量</span><input class="text-input" inputmode="numeric" type="number" min="0" placeholder="未核实可留空"></label><label class="formfield"><span>现用品牌或供应商</span><input class="text-input" placeholder="选填"></label><p class="help">已有资料带入，只补充本次核实的信息。</p></details><div id="formError" class="error" role="alert" tabindex="-1" hidden></div></section>
</main><footer class="footer"><button class="primary" id="complete">完成拜访</button></footer>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><h2 id="sheetTitle" tabindex="-1" autofocus></h2><button class="icon-button" id="closeSheet" aria-label="关闭面板"><svg><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="sheet-body" id="sheetBody"></div><div class="sheet-footer"><button id="sheetConfirm" class="primary">确定</button></div></dialog>
<script type="module">
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dict=await fetch('./dictionaries.demo.json').then(r=>{if(!r.ok)throw Error('字典演示文件加载失败');return r.json()});
const state={status:'OPEN',type:'DEMO_ENTERTAINMENT',outcome:'CONTACTED',nextAction:'DEMO_PROPOSAL',nextDate:'2026-11-17T10:00',reason:'',noIntent:false,photo:false,ended:false,person:'王先生 · 店长',business:[{code:'DEMO_AMAP',intention:'HIGH',cooperated:false},{code:'DEMO_RETAIL',intention:null,cooperated:true}]};
const label=(code,value)=>dict[code].find(x=>x.code===value)?.name??'请选择';
let commit=()=>{}, attempted=false;
const fieldErrors=['status','type','statusReasonInput','typeReasonInput','outcomes','person','businesses','reason','reasonOtherInput','photo','nextAction','nextDate'];
for(const id of fieldErrors){const e=document.createElement('p');e.id=id+'Error';e.className='field-error';$(id).after(e);$(id).setAttribute('aria-describedby',e.id)}
function open(title,body,fn,button='确定'){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('sheetConfirm').textContent=button;commit=fn;$('sheet').showModal()}
function close(){$('sheet').close()}
$('closeSheet').onclick=close;$('sheetConfirm').onclick=()=>{if(commit()!==false)close()};
function saved(){$('saved').textContent='草稿已保存';if(attempted)validate(false)}
function choices(title,key,current,apply){open(title,dict[key].map(x=>`<label class="sheet-option"><input type="radio" name="option" value="${esc(x.code)}" ${current===x.code?'checked':''}><span>${esc(x.name)}${x.description?`<span class="description">${esc(x.description)}</span>`:''}</span></label>`).join(''),()=>{const v=$('sheetBody').querySelector('input:checked');if(!v)return false;apply(v.value);saved()})}
function render(){
 $('statusLabel').textContent=label('CRM_STORE_BUSINESS_STATUS',state.status);$('typeLabel').textContent=label('STORE_BUSINESS_TYPE',state.type);$('statusReason').hidden=!['TEMP_CLOSED','CLOSED'].includes(state.status);$('typeReason').hidden=state.type!=='DEMO_OTHER';$('reasonOther').hidden=state.reason!=='DEMO_OTHER';$('actionReq').hidden=!state.nextDate&&!state.nextAction;$('dateReq').hidden=!state.nextDate&&!state.nextAction;$('nextActionLabel').textContent=state.nextAction?label('VISIT_NEXT_ACTION',state.nextAction):'请选择';$('dateLabel').textContent=state.nextDate?state.nextDate.replace('T',' ').slice(5):'请选择';
 $('outcomes').innerHTML=dict.VISIT_CONTACT_OUTCOME.map(x=>`<button data-outcome="${esc(x.code)}" aria-pressed="${state.outcome===x.code}">${esc(x.name)}</button>`).join('');
 document.querySelectorAll('[data-outcome]').forEach(b=>b.onclick=()=>{state.outcome=b.dataset.outcome;render();saved()});
 $('contactedFields').hidden=state.outcome!=='CONTACTED';$('uncontactedFields').hidden=state.outcome==='CONTACTED';
 $('businesses').innerHTML=state.business.map((x,i)=>`<button class="business" data-business="${i}"><span class="line"><span class="business-mark" aria-hidden="true">${esc(label('BUSINESS_LINE',x.code).slice(0,1))}</span><span>${esc(label('BUSINESS_LINE',x.code))}</span></span><span class="line"><span class="badge ${x.cooperated?'cooperated':''}">${esc(x.cooperated?label('CUSTOMER_COOP_STATUS','DEMO_COOPERATED'):label('CUSTOMER_INTENTION_LEVEL',x.intention))}${!x.cooperated&&!x.intention?' *':''}</span><svg><path d="m9 6 6 6-6 6"/></svg></span></button>`).join('');
 document.querySelectorAll('[data-business]').forEach(b=>b.onclick=()=>editBusiness(Number(b.dataset.business)));$('noIntent').hidden=state.business.length>0;$('noIntent').textContent=state.noIntent?'暂无合作意向':'选择合作情况';
 $('photoCount').textContent=state.photo?'1 / 1 张':'0 / 1 张';$('photo').classList.toggle('done',state.photo);$('photo').querySelector('span').textContent=state.photo?'示例照片':'拍门头照';
}
function editBusiness(index){let original=state.business[index],intention=original.intention,cooperated=original.cooperated;open(label('BUSINESS_LINE',original.code)+' · 合作进展',`<p class="help">本次确认的合作情况</p><p class="sheet-label">合作意向</p><div class="sheet-grid" id="stageGrid">${dict.CUSTOMER_INTENTION_LEVEL.map(x=>`<button class="choice" data-stage="${x.code}" aria-pressed="${!cooperated&&intention===x.code}">${esc(x.name)}</button>`).join('')}</div><p class="sheet-label">已开展合作</p><button class="choice" id="cooperatedChoice" style="width:100%" aria-pressed="${cooperated}">${esc(label('CUSTOMER_COOP_STATUS','DEMO_COOPERATED'))}</button><label class="formfield"><span>本次需求 <span class="muted">选填</span></span><textarea id="businessNeed" class="textarea" placeholder="如：引流方案、补货需求、设备体验">${esc(original.need??'')}</textarea></label>`,()=>{if(!cooperated&&!intention)return false;state.business[index]={...original,intention:cooperated?null:intention,cooperated,need:$('businessNeed').value};render();saved()});
 const mark=()=>{document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(!cooperated&&b.dataset.stage===intention)));$('cooperatedChoice').setAttribute('aria-pressed',String(cooperated))};document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{cooperated=false;intention=b.dataset.stage;mark()});$('cooperatedChoice').onclick=()=>{cooperated=true;mark()};}
$('status').onclick=()=>choices('营业状态','CRM_STORE_BUSINESS_STATUS',state.status,v=>{state.status=v;render()});
$('type').onclick=()=>choices('经营类型','STORE_BUSINESS_TYPE',state.type,v=>{state.type=v;render()});
$('reason').onclick=()=>choices('未接触原因','VISIT_NO_CONTACT_REASON',state.reason,v=>{state.reason=v;$('reasonLabel').textContent=label('VISIT_NO_CONTACT_REASON',v);render()});
$('addBusiness').onclick=()=>{open('添加业务',dict.BUSINESS_LINE.map(x=>`<label class="sheet-option"><input type="checkbox" value="${esc(x.code)}" ${state.business.some(b=>b.code===x.code)?'checked':''}><span>${esc(x.name)}</span></label>`).join(''),()=>{const values=Array.from($('sheetBody').querySelectorAll('input:checked')).map(i=>i.value);state.business=values.map(v=>state.business.find(b=>b.code===v)??{code:v,intention:null,cooperated:false});render();saved()});};
$('noIntent').onclick=()=>open('合作情况','<p style="padding:12px 0">本次沟通暂无合作意向。</p>',()=>{state.noIntent=true;render();saved()},'确认暂无意向');
$('person').onclick=()=>{open('本次接待人','<label class="sheet-option"><input type="radio" name="person" value="王先生 · 店长" checked><span>王先生 <span class="muted">店长</span><span class="description">已关联企微</span></span></label><details class="optional"><summary>＋ 新增接待人</summary><label class="formfield"><span>姓名</span><input id="newPerson" class="text-input"></label><label class="formfield"><span>联系电话 · 选填</span><input class="text-input" type="tel"></label></details>',()=>{state.person=$('newPerson').value.trim()||'王先生 · 店长';$('personLabel').textContent=state.person;saved()})};
$('nextAction').onclick=()=>choices('下步行动','VISIT_NEXT_ACTION','DEMO_PROPOSAL',v=>{state.nextAction=v;render()});
$('nextDate').onclick=()=>open('跟进时间','<label class="formfield"><span>日期与时间</span><input id="dateInput" class="text-input" type="datetime-local" value="2026-11-17T10:00"></label>',()=>{if(!$('dateInput').value)return false;state.nextDate=$('dateInput').value;render();saved()});
$('photo').onclick=()=>{state.photo=!state.photo;render();saved()};$('note').oninput=saved;
$('record').onclick=()=>open('现场录音',`<div class="between" style="padding:12px 0"><span>本次录音</span><span class="green">${state.ended?'已结束':'录音中 · 12:36'}</span></div><p class="help">设计稿中的状态仅用于演示。</p>`,()=>{});
function validate(focus){
 const errors=[];const add=(id,message)=>errors.push({id,message});
 if(!state.status)add('status','请选择营业状态');
 if(['TEMP_CLOSED','CLOSED'].includes(state.status)&&!$('statusReasonInput').value.trim())add('statusReasonInput','请填写'+label('CRM_STORE_BUSINESS_STATUS',state.status)+'的核实依据');
 if(!state.type)add('type','请选择经营类型，暂不清楚可选“暂未核实”');
 if(state.type==='DEMO_OTHER'&&!$('typeReasonInput').value.trim())add('typeReasonInput','请填写其他经营类型');
 if(!state.outcome)add('outcomes','请选择已沟通或未接触');
 if(state.outcome==='CONTACTED'){
  if(!state.person)add('person','请选择本次接待人');
  if(!state.business.length&&!state.noIntent)add('businesses','请添加有进展的业务，或选择“暂无合作意向”');
  for(const x of state.business)if(!x.cooperated&&!x.intention)add('businesses','请选择'+label('BUSINESS_LINE',x.code)+'的合作进展');
 }else if(state.outcome==='OTHER_NO_CONTACT'){
  if(!state.reason)add('reason','请选择未接触原因');
  if(state.reason==='DEMO_OTHER'&&!$('reasonOtherInput').value.trim())add('reasonOtherInput','请填写其他未接触原因');
 }
 if(!state.photo)add('photo','请拍摄 1 张门头照');
 if(state.nextAction&&!state.nextDate)add('nextDate','请选择跟进时间');
 if(state.nextDate&&!state.nextAction)add('nextAction','请选择下步行动');
 for(const id of fieldErrors){const messages=errors.filter(x=>x.id===id).map(x=>x.message);$(id+'Error').textContent=messages.join('；');$(id).setAttribute('aria-invalid',String(messages.length>0))}
 $('formError').hidden=!errors.length;$('formError').innerHTML=errors.length?`<button class="error-link" id="firstErrorLink">还有 ${errors.length} 项必填信息未完成，点击查看</button>`:'';
 function first(){const e=errors[0];let target=$(e.id);if(e.id==='businesses')target=target.querySelector('button')??$('addBusiness');if(e.id==='outcomes')target=target.querySelector('button');target.scrollIntoView({block:'center'});target.focus({preventScroll:true})}
 if(errors.length){$('firstErrorLink').onclick=first;if(focus)first()}
 return !errors.length;
}
for(const id of ['statusReasonInput','typeReasonInput','reasonOtherInput'])$(id).oninput=saved;
$('complete').onclick=()=>{attempted=true;if(!validate(true))return;open('完成拜访',`<p style="margin:12px 0">${esc(label('CRM_STORE_BUSINESS_STATUS',state.status))} · ${esc(label('STORE_BUSINESS_TYPE',state.type))}</p><p class="muted">拜访结果提交后，已核实的门店信息同步更新。</p><p class="help">当前为设计演示，不会提交实际业务数据。</p>`,()=>{$('navTitle').textContent='拜访详情';$('complete').textContent='设计演示已完成';$('complete').disabled=true;$('recordText').textContent='录音已结束';$('saved').textContent='演示已提交'},'确认完成')};
function endVisit(){state.ended=true;$('navTitle').textContent='拜访详情';$('endBanner').hidden=false;$('complete').textContent='提交结果';$('recordText').textContent='录音已结束'}
$('back').onclick=()=>open('返回门店','<p style="padding:12px 0">草稿会保留，进行中的拜访可从门店继续。</p><p class="help">当前是独立设计原型。</p>',()=>{});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='auto-end')endVisit();if(e.data==='reset')location.reload();if(e.data==='required-demo'){state.status='';state.type='';state.person='';state.outcome='CONTACTED';state.business=[{code:'DEMO_AMAP',intention:null,cooperated:false}];state.photo=false;state.nextAction='DEMO_PROPOSAL';state.nextDate='';$('personLabel').textContent='请选择';$('note').value='';render();attempted=true;validate(true)}});
render();const view=new URLSearchParams(location.search).get('view');if(view==='followup')window.scrollTo(0,$('materials').offsetTop-56);if(view==='business')editBusiness(0);if(view==='ended')endVisit();if(view)window.parent.postMessage('preview-ready',location.origin);
</script></body></html>
