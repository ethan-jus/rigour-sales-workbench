<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机开发门店 · 交互设计</title>
<style>
:root{--ink:#253041;--muted:#687483;--line:#e5e9ee;--orange:#c64c1c;--blue:#2263d6;--bg:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 'PingFang SC','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bbbf6;outline-offset:3px}header.studio{height:58px;background:white;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between}header.studio b{font-size:15px}.studio small{color:var(--muted)}.workspace{display:grid;grid-template-columns:260px 390px 270px;gap:44px;max-width:1096px;margin:32px auto;padding:0 16px;align-items:start}h1{font-size:25px;line-height:1.4;letter-spacing:-.5px;margin:6px 0 14px}p{margin:0 0 16px}.intro{color:var(--muted);font-size:13px;line-height:1.9}.stage-list{display:grid;gap:3px;margin-top:24px}.stage-list button{text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:6px;color:var(--muted)}.stage-list button.active{background:#e7edf5;color:var(--ink);font-weight:600}.hintbox{border-top:1px solid #d5dce5;padding-top:20px;margin-top:26px;font-size:13px;color:var(--muted)}.hintbox b{display:block;color:var(--ink);margin-bottom:9px}.phone{background:white;border:1px solid #d8dee5;border-radius:26px;width:390px;overflow:hidden;box-shadow:0 12px 34px #2432470b}.statusbar{height:38px;padding:12px 22px 0;font-size:11px;font-weight:600;display:flex;justify-content:space-between}.app{height:754px;display:flex;flex-direction:column}.nav{display:flex;height:56px;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}.nav strong{font-size:18px;flex:1;text-align:center}.nav .edge{width:66px}.iconbtn{border:0;background:none;padding:10px 0;min-height:44px;display:flex;align-items:center;color:var(--ink)}.nav .link{font-size:13px;white-space:nowrap;text-align:right}.content{overflow:auto;flex:1;padding:0 20px 24px;scrollbar-width:thin}h2{font-size:21px;line-height:1.4;margin:16px 0 8px}h3{font-size:15px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.search{display:flex;align-items:center;gap:8px;background:#f3f5f7;border-radius:8px;padding:0 12px;height:44px}.search .textbtn{flex-shrink:0;white-space:nowrap}.search input{min-width:0;width:100%;border:0;background:none;outline:0;font-size:14px}.search svg{flex-shrink:0}.local{display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px;font-size:12px}.textbtn{border:0;padding:0;background:none;color:var(--blue);min-height:36px;font-size:13px}.filter{display:flex;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}.chip{border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 11px;font-size:12px;min-height:34px}.chip.on{color:var(--orange);border-color:#e5b7a4;background:#fff7f3}.sectionline{display:flex;justify-content:space-between;margin:19px 0 4px;align-items:center}.store{padding:17px 0;border-bottom:1px solid var(--line)}.store h3{font-size:16px;margin-bottom:7px;font-weight:600}.store p{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.65}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{font-size:11px;padding:3px 6px;background:#f1f4f7;border-radius:3px;white-space:nowrap;color:#506075}.tag.blue{background:#edf3fe;color:var(--blue)}.tag.orange{background:#fff2e9;color:#a14822}.listaction{border:0;background:none;color:var(--orange);font-size:13px;min-height:36px;padding:0 0 0 14px}.distance{color:#4e5a68;font-size:12px}.findmore{text-align:center;padding:24px 0 8px;color:var(--muted);font-size:12px}.findmore button{display:block;margin:4px auto}.bottom{padding:14px 20px 18px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}.primary{width:100%;height:46px;border:0;background:var(--orange);color:white;border-radius:8px;font-weight:600;font-size:15px}.secondary{width:100%;height:44px;border:1px solid var(--line);background:white;border-radius:8px;margin-top:8px}.quiet{width:100%;border:0;background:none;min-height:40px;color:var(--muted);font-size:13px}.facts{margin:18px 0 10px}.fact{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.fact dt{width:58px;color:var(--muted);flex-shrink:0}.fact dd{margin:0;flex:1;line-height:1.7}.map{height:164px;background:#eef3f5;border-radius:8px;overflow:hidden;position:relative;margin:18px 0 8px}.map svg{width:100%;height:100%}.map.large{height:340px;margin-top:0}.source{font-size:11px;color:var(--muted);margin-top:8px}.notice{font-size:13px;padding:12px;background:#f0f5fd;color:#375b8d;border-radius:6px;margin:10px 0 18px}.success{display:flex;gap:8px;align-items:center;background:#edf5f1;color:#2f7054;font-size:13px;padding:10px 12px;border-radius:6px;margin:8px 0 18px}.section{padding:20px 0;border-top:1px solid var(--line);margin-top:20px}.section p{font-size:13px;color:var(--muted);margin-top:8px}.label{display:block;font-size:13px;margin:18px 0 7px}.required:after{content:' *';color:var(--orange)}.field{border:1px solid #dbe1e7;border-radius:6px;background:#fff;width:100%;padding:11px;font-size:14px}.field.loc{display:flex;align-items:center;justify-content:space-between;text-align:left}.subhead{font-size:12px;color:var(--muted);margin:0}.error{font-size:12px;color:#ad382c;padding:10px;background:#fff1ee;border-radius:5px;margin-top:12px}.empty{padding:65px 12px;text-align:center}.empty strong{font-size:16px}.empty p{font-size:13px;color:var(--muted);margin-top:10px}.timeline{margin:24px 0;padding:0 0 0 18px;border-left:1px solid var(--line)}.timeline div{position:relative;margin:0 0 23px;font-size:13px}.timeline div:before{content:'';position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:#9aabba;border:2px solid white}.timeline b{display:block}.timeline small{display:block;color:var(--muted);margin-top:3px}.aside-right{font-size:13px;line-height:1.85;padding-top:7px}.aside-right h2{font-size:17px;margin:0 0 12px}.aside-right p{color:var(--muted)}.aside-right ul{padding-left:18px;color:var(--muted)}.demo-buttons{display:grid;gap:8px;margin-top:18px}.demo-buttons button{padding:8px 12px;border:1px solid #d7dfe8;border-radius:6px;text-align:left;background:white;font-size:12px}.bottom-note{font-size:11px;color:var(--muted);margin:0 0 9px;text-align:center}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.category{background:#fff;border:1px solid var(--line);padding:16px 10px;border-radius:7px}.category.on{border-color:var(--orange);color:var(--orange)}svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.list-link{width:100%;background:none;border:0;display:block;text-align:left;padding:0}.caption{max-width:1096px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:12px}@media(max-width:1000px){.workspace{grid-template-columns:210px 390px;justify-content:center;gap:28px}.aside-right{grid-column:1/-1;max-width:630px}.studio small{display:none}}@media(max-width:660px){header.studio{padding:0 18px;height:48px}.workspace{display:flex;flex-direction:column;margin:16px auto;align-items:center;padding:0 12px}.intro-panel{width:100%}.intro-panel h1{font-size:21px}.intro-panel .intro,.hintbox{display:none}.stage-list{display:flex;overflow:auto;margin:0 0 8px;max-width:100%}.stage-list button{white-space:nowrap;padding:9px}.phone{width:min(390px,100%)}.app{height:740px}.aside-right{width:100%}.caption{padding:0 18px}}
</style></head><body>
<svg style="display:none"><symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol><symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol></svg>
<header class="studio"><b>销售工作台 / 开发门店</b><small>交互设计稿 · 示例门店与地图 · 不会创建真实数据</small></header>
<main class="workspace"><aside class="intro-panel"><h1>找到新店，<br>接着去拜访。</h1><p class="intro">高德核验后入公海，认领后才属于本人。每一步都有明确结果，现场作业不中断。</p><nav class="stage-list" id="stages" aria-label="设计页面"></nav><div class="hintbox"><b>入口</b>客户页 → 开发门店<br>公海 → 新增门店<br>搜索无结果 → 查找新门店</div></aside><section class="phone" aria-label="手机交互原型"><div class="statusbar"><span>14:08</span><span>◂▮▮　Wi-Fi　82%</span></div><div id="app" class="app"></div></section><aside class="aside-right"><h2 id="explain-title"></h2><p id="explain"></p><div class="hintbox"><b>交互口径</b><span id="rule"></span></div><div class="demo-buttons" id="demos"></div></aside></main><p class="caption">本稿仅演示操作与状态。门店名称、距离、保护期均为示例；上线时使用真实高德结果、公司门店档案和当前归属规则。</p>
<script>
const $=id=>document.getElementById(id),icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`;
const pages=['开发门店','核对高德门店','公海认领','私海接续拜访','手动提报','选择位置','我的提报','提报详情','重复核查'];let page=0,added=false,claimed=false,selectedCategory='台球厅',position=false,submitted=false,rejected=false,keyword='',message='',activeWork=false,locationReturn=4,selected=0;
const stores=[['星河台球俱乐部（广渠门店）','北京市东城区广渠门内大街18号二层'],['名仕台球（东花市店）','北京市东城区东花市南里路12号'],['壹号球房（光明路店）','北京市东城区光明路6号商业楼三层']];
const draft={name:'',address:'',area:'北京市 / 东城区',type:'体育休闲 / 台球厅',phone:''};
const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function pickLocation(from){locationReturn=from;go(5)}
function editRejected(){Object.assign(draft,{name:'绿洲台球俱乐部',address:'广渠门内大街',area:'北京市 / 东城区',type:'体育休闲 / 台球厅',phone:''});position=true;go(4)}
const notes=[['以附近门店为入口','先看店名、地址与距离，再核对具体资料。公司已存在的门店直接使用原档案，避免重复录入。','列表查重只是预检，入库仍由服务器核验高德详情和全库重复。'],['资料一次核对','高德返回的名称、地址和位置只读展示。现场发现资料不符，切换手动提报审核。','不让销售修改可信字段后仍以“高德核验”身份直接入库。'],['入库与认领分开','新增成功后留在公海详情，接着点击认领。不会因录入门店自动获得归属。','认领使用现有规则；容量、区域、冷却和竞争冲突都以服务端结果为准。'],['回到熟悉的客户详情','认领成功后复用现有客户详情与拜访流程。不再要求录一遍门店资料。','未签到时去现有拜访页签到，回来后明确开始拜访；不自动打卡。'],['手填只录建档信息','高德未收录或资料不符时提报。联系人、照片、录音和拜访结果放在后续拜访中采集。','手动提报需后台审核，不能先进入私海或按正式门店拜访。'],['确认门店实际位置','允许搜索地址、拖动定位并核对街道。当前位置只作定位辅助，不能不经确认直接当门店坐标。','原型地图为示意。实现时沿用原生地图和统一坐标转换。'],['提报有去处','从开发门店右上角进入。待审核可查看，退回可修改，已入库可去公海认领。','只展示本人提报；不能因为新增权限获得其他销售的私海资料。'],['退回说明要可操作','完整展示后台退回原因，保留原填写内容，修改后重提。已通过则使用返回的原门店档案。','不会让销售重复新建一条提报绕过审核。'],['查重后使用原档案','明确重复时转到公司原门店，疑似重复时交后台核验，不做“仍要新建”开关。','他人私海只告知已存在、不可重复创建，不展示无权查看的资料。']];
function map(large=false){return `<div class="map ${large?'large':''}"><svg viewBox="0 0 350 180" preserveAspectRatio="xMidYMid slice" aria-label="门店位置示意"><rect width="350" height="180" fill="#edf2f4"/><path d="M-20 150 370 85M60-20 100 200M270-20 210 200" stroke="#dce4e8" stroke-width="25" fill="none"/><path d="M-20 150 370 85M60-20 100 200M270-20 210 200" stroke="white" stroke-width="15" fill="none"/><path d="M110 20h96v52h-96zM118 142h65v30h-65z" fill="#dfe9e4"/><text x="20" y="110" font-size="10" fill="#758391">广渠门内大街</text><g transform="translate(182 83)"><path d="M0 29S-13 9-13 0a13 13 0 0 1 26 0C13 9 0 29 0 29" fill="#c64c1c" stroke="white" stroke-width="3"/><circle r="4" fill="white"/></g></svg></div>`}
function nav(title,right='',action=''){return `<div class="nav"><button class="iconbtn edge" aria-label="返回" onclick="go(${page===0?0:page===5?locationReturn:page===7?6:0})">${icon('back')}</button><strong>${title}</strong><button class="textbtn edge link" onclick="${action}">${right}</button></div>`}
function foot(label,action,note=''){return `<div class="bottom">${note?`<p class="bottom-note">${note}</p>`:''}<button class="primary" onclick="${action}">${label}</button></div>`}
function facts(address=stores[selected][1],type="体育休闲 / 台球厅",area="北京市 · 东城区"){return `<dl class="facts"><div class="fact"><dt>门店地址</dt><dd>${esc(address)}</dd></div><div class="fact"><dt>门店分类</dt><dd>${esc(type)}</dd></div><div class="fact"><dt>所在地区</dt><dd>${esc(area)}</dd></div></dl>`}
function store(name,address,tag,dist,action,label){return `<article class="store"><h3>${name}</h3><p>${address}</p><div class="row"><span><span class="tag ${tag==='未入库'?'orange':'blue'}">${tag}</span> <span class="distance">${dist}</span></span><button class="listaction" onclick="${action}">${label}</button></div></article>`}
function error(){return message?`<div class="error" role="status">${message}</div>`:''}
function go(n){if(n===1||n===8)selected=0;page=n;message='';render()}
function render(){ $('stages').innerHTML=pages.map((p,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${p}</button>`).join('');const n=notes[page];$('explain-title').textContent=n[0];$('explain').textContent=n[1];$('rule').textContent=n[2];$('demos').innerHTML=page===0?`<button onclick="keyword='无结果';render()">演示：没有搜索结果</button><button onclick="keyword='';message='定位暂未成功，可选择地区后按店名搜索。';render()">演示：定位失败</button>`:page===1?`<button onclick="go(8)">演示：入库时发现重复</button><button onclick="message='暂时无法连接，请重试。门店资料已保留。';render()">演示：入库请求失败</button>`:page===2?`<button onclick="message='门店已被其他销售认领，暂时无法认领。';render()">演示：认领竞争失败</button>`:page===3?`<button onclick="activeWork=!activeWork;render()">切换：${activeWork?'未签到':'已签到'}</button>`:page===7?`<button onclick="rejected=!rejected;render()">切换：${rejected?'待审核':'被退回'}</button>`:'';
let html='';
if(page===0){html=nav('开发门店','我的提报','go(6)')+`<div class="content"><form class="search" onsubmit="event.preventDefault();keyword=this.querySelector('input').value;render()">${icon('search')}<input aria-label="搜索门店" placeholder="输入店名或地址" value="${esc(keyword==='无结果'?'新发现门店':keyword)}"><button class="textbtn">搜索</button></form><div class="local"><span>北京市东城区 · 当前位置附近</span><button class="textbtn" onclick="pickLocation(0)">调整位置</button></div><div class="filter"><button class="chip on" onclick="message='当前查看附近3公里内的候选门店';render()">附近 3 km</button><button class="chip" onclick="selectedCategory=selectedCategory==='台球厅'?'全部类型':'台球厅';render()">${selectedCategory}⌄</button></div>${error()}<div class="sectionline"><h3>附近可开发门店</h3><span class="muted small">高德地图</span></div>${keyword==='无结果'?`<div class="empty"><strong>未找到匹配门店</strong><p>试试门店简称，或直接手动提报。</p><button class="textbtn" onclick="keyword='';render()">重新查找</button></div>`:store('星河台球俱乐部（广渠门店）','广渠门内大街18号二层','未入库','180 m','selected=0;go(1)','核对门店')+store('名仕台球（东花市店）','东花市南里路12号','公海','460 m','selected=1;added=false;go(2)','查看档案')+store('壹号球房（光明路店）','光明路6号商业楼三层','我的私海','720 m','selected=2;claimed=false;go(3)','查看客户')}<div class="findmore">附近没有这家门店？<button class="textbtn" onclick="go(4)">手动填写门店</button></div></div>`}
if(page===1){html=nav('核对门店')+`<div class="content"><span class="tag orange">未入库</span><h2>星河台球俱乐部<br>（广渠门店）</h2><p class="subhead">距离当前位置 180 m</p>${map()}${facts()}<p class="source">资料来源：高德地图</p><button class="textbtn" onclick="go(4)">资料不符，改为手动填写</button>${error()}</div>`+foot('加入公海','selected=0;added=true;go(2)','入库后需要认领，才能开始拜访')}
if(page===2){html=nav('门店详情')+`<div class="content">${added?`<div class="success">${icon('check')}门店已加入公海</div>`:''}<span class="tag blue">公海 · 未认领</span><h2>${stores[selected][0]}</h2><p class="muted small">当前无销售负责</p>${facts()}<div class="section"><h3>认领后开始开发</h3><p>认领成功后加入“我的客户”，拜访保护期按当前规则计算。</p></div>${error()}</div>`+foot('认领门店',"claimed=true;go(3)")}
if(page===3){html=nav('客户详情')+`<div class="content">${claimed?`<div class="success">${icon('check')}已认领到我的客户</div>`:''}<span class="tag blue">我的私海</span><h2>${stores[selected][0]}</h2><p class="muted small">负责人：张松</p>${facts()}<div class="section"><h3>首次拜访</h3><p>认领后及时完成首次有效拜访。</p><div class="row"><span class="muted small">首次拜访截止</span><strong>明天 14:08</strong></div></div><div class="section"><h3>联系人</h3><p>暂无联系人，可在拜访中补充。</p></div>${!activeWork?'<div class="notice">当前尚未签到，签到后即可开始拜访。</div>':''}${error()}</div>`+foot(activeWork?'开始拜访':'前往签到',activeWork?"message='设计演示：接续现有拜访填写页。';render()":"message='设计演示：跳转现有拜访签到页，保留待拜访门店。';render()")}
if(page===4){html=nav(rejected?'修改门店提报':'手动提报')+`<form id="manual" class="content" oninput="if(event.target.id in draft)draft[event.target.id]=event.target.value" onchange="if(event.target.id in draft)draft[event.target.id]=event.target.value" onsubmit="event.preventDefault()"><p class="subhead">资料审核通过后进入公海。</p><label class="label required" for="name">门店名称</label><input id="name" class="field" required placeholder="与门头名称一致" value="${esc(draft.name)}"><label class="label required" for="area">所在地区</label><select id="area" class="field"><option>北京市 / 东城区</option><option>北京市 / 朝阳区</option></select><label class="label required" for="address">详细地址</label><input id="address" class="field" required placeholder="道路、门牌号及楼层" value="${esc(draft.address)}"><label class="label required">门店位置</label><button type="button" class="field loc" onclick="pickLocation(4)"><span>${position?'广渠门内大街18号':'在地图上确认位置'}</span>${icon('pin')}</button><label class="label required" for="type">门店分类</label><select id="type" class="field"><option>体育休闲 / 台球厅</option><option>餐饮服务 / 中餐厅</option><option>购物服务 / 便利店</option></select><label class="label" for="phone">公开电话 <span class="muted small">选填</span></label><input id="phone" class="field" type="tel" value="${esc(draft.phone)}" placeholder="门店公开联系电话">${rejected?'<div class="notice">退回原因：请补充实际门牌号和楼层，便于核对门店位置。</div>':''}${error()}</form>`+foot('提交审核','submitManual()')}
if(page===5){html=nav('选择门店位置')+`<div class="content"><div class="search">${icon('search')}<input aria-label="查找地址" placeholder="搜索道路、建筑或门店" value="广渠门内大街18号"></div>${map(true)}<h3>广渠门内大街18号</h3><p class="muted small" style="margin-top:8px">北京市东城区</p><p class="source">请核对定位与实际门店一致。</p></div>`+foot('使用此位置',"if(locationReturn===4){position=true;if(!draft.address)draft.address='广渠门内大街18号二层'}go(locationReturn)")}
if(page===6){html=nav('我的提报')+`<div class="content"><div class="filter"><button class="chip on" onclick="message='已展示本人全部提报';render()">全部</button><button class="chip" onclick="submitted=true;rejected=false;go(7)">待审核</button><button class="chip" onclick="rejected=true;go(7)">已退回</button></div>${error()}<button class="list-link" onclick="rejected=false;go(7)"><article class="store"><div class="row"><h3>${esc(submitted?draft.name:"星河台球俱乐部")}</h3><span class="tag blue">待审核</span></div><p>${esc(submitted?draft.address:"广渠门内大街18号二层")}</p><span class="muted small">今天 14:08 提交</span></article></button><button class="list-link" onclick="rejected=true;go(7)"><article class="store"><div class="row"><h3>绿洲台球俱乐部</h3><span class="tag orange">已退回</span></div><p>请补充实际门牌号和楼层</p><span class="muted small">昨天 16:20 更新</span></article></button><button class="list-link" onclick="selected=1;added=false;go(2)"><article class="store"><div class="row"><h3>名仕台球（东花市店）</h3><span class="tag">已入公海</span></div><p>东花市南里路12号</p><span class="muted small">可前往公海认领</span></article></button></div>`}
if(page===7){html=nav('提报详情')+`<div class="content"><span class="tag ${rejected?'orange':'blue'}">${rejected?'已退回':'待审核'}</span><h2>${rejected?'绿洲台球俱乐部':esc(submitted?draft.name:'星河台球俱乐部')}</h2>${rejected?'<div class="notice">请补充实际门牌号和楼层，便于核对门店位置。</div>':'<p class="muted small">审核通过后进入公海，再认领开展拜访。</p>'}${facts(submitted&&!rejected?draft.address:stores[0][1],submitted&&!rejected?draft.type:undefined,submitted&&!rejected?draft.area:undefined)}<p class="source">资料来源：手动提报</p><div class="section"><h3>提报进度</h3><div class="timeline"><div><b>${rejected?'退回补充资料':'等待审核'}</b><small>${rejected?'昨天 16:20':'资料已收到'}</small></div><div><b>提交门店资料</b><small>张松　${rejected?'昨天 15:06':'今天 14:08'}</small></div></div></div></div>`+(rejected?foot('修改后重提','editRejected()'):foot('返回我的提报','go(6)'))}
if(page===8){html=nav('核对已有门店')+`<div class="content"><div class="notice">公司已有同一门店，请使用原档案。</div><h2>星河台球俱乐部<br>（广渠门店）</h2><span class="tag blue">公海 · 可认领</span>${facts()}<div class="section"><h3>如果不是同一家</h3><p>手动提报准确名称和地址，交由后台核验，避免重复建立客户档案。</p><button class="textbtn" onclick="go(4)">手动提报核验</button></div></div>`+foot('查看原门店','selected=0;added=false;go(2)')}
$('app').innerHTML=html;if(page===4){$('area').value=draft.area;$('type').value=draft.type;}
}
function submitManual(){const f=$('manual');if(!f.reportValidity())return;if(!position){message='请先在地图上确认门店位置。';render();return}submitted=true;rejected=false;go(7)}render();
</script></body></html>
