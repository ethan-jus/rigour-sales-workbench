buildscript {
    dependencies {
        classpath files('../sdk/Android-uni-app-x-SDK@15075-5.26/plugins/uts-kotlin-compiler-plugin-0.0.1.jar')
        classpath files('../sdk/Android-uni-app-x-SDK@15075-5.26/plugins/uts-kotlin-gradle-plugin-0.0.1.jar')
    }
}
plugins {
    id 'com.android.application' version '8.12.0'
    id 'com.android.library' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0'
}
apply plugin: 'io.dcloud.uts.kotlin'
def releaseInfo = new groovy.json.JsonSlurper().parse(file('release.json'))
android {
    namespace 'com.rigour.workbench'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rigour.workbench'
        minSdk 21
        targetSdk 32
        versionCode releaseInfo.versionCode
        versionName releaseInfo.versionName
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        buildConfigField 'String', 'UTSRegisterProviders', groovy.json.JsonOutput.toJson('[{"name":"system","service":"location","class":"uts.sdk.modules.DCloudUniLocationSystem.UniLocationSystemProviderImpl"}]')
        buildConfigField 'String', 'UTSEasyCom', groovy.json.JsonOutput.toJson(releaseInfo.easycom)
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false; debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.squareup.okhttp3:okhttp:3.12.12'
    implementation 'com.github.getActivity:XXPermissions:18.63'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.0'
    implementation 'androidx.media:media:1.4.3'
}
apply from: 'plugins.gradle'
